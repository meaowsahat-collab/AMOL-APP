<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>Amol</title>
<style>
@font-face{font-family:'Amiri';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/amiri-arabic-400-normal.woff2) format('woff2')}
@font-face{font-family:'Amiri';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/amiri-arabic-700-normal.woff2) format('woff2')}
:root{--bg:#f6f3ea;--card:#fff;--ink:#1c2a24;--mute:#5f6e66;--green:#0f3d2e;--accent:#0f3d2e;--gold:#b88a2c;--goldtxt:#8a6410;--line:#e4dfd0;--chip:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1512;--card:#16211c;--ink:#e8efe9;--mute:#93a59b;--accent:#d9ab4a;--gold:#d9ab4a;--goldtxt:#d9ab4a;--line:#26352d;--chip:#16211c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali","Noto Sans Devanagari",sans-serif;line-height:1.65;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
header{background:#0f3d2e;color:#fff;padding:10px 16px;position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;display:block}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
#lang{font:inherit;font-size:15px;min-height:40px;padding:0 10px;border-radius:20px;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff}
#lang option{color:#1c2a24}
main{max-width:720px;margin:0 auto;padding:14px}
h2.page{font-size:20px;margin:6px 0 2px}
.sub{font-size:13px;color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px;box-shadow:0 1px 8px rgba(15,61,46,.05)}
.topic{color:var(--goldtxt);font-weight:700;font-size:15px;margin:0 0 10px}
.ar{font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;font-size:21px;line-height:2.05;direction:rtl;text-align:right;margin:0 0 12px;color:var(--accent);white-space:pre-line}
.tr{margin:0 0 12px;white-space:pre-line;font-size:16px;line-height:1.75}
.card:not(.open) .long{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
.card:not(.open) .tr.long{-webkit-line-clamp:7}
.more{border:0;background:none;padding:6px 0 10px;color:var(--goldtxt);font-weight:600;font-size:14px;min-height:36px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.src{font-size:12.5px;color:var(--goldtxt);font-weight:600;line-height:1.4}
.acts{display:flex;gap:4px;flex:none}
.ic{width:44px;height:44px;border-radius:12px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.ic:active{background:var(--line)}
.ic svg{width:22px;height:22px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;border-top:3px solid transparent;background:none;color:var(--mute);padding:8px 2px 6px;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent);font-weight:700;border-top-color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 12px;padding:2px 14px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:42px;padding:0 16px;border-radius:21px;border:1px solid var(--line);background:var(--chip);font-size:14.5px;white-space:nowrap}
.chips button.on{background:#0f3d2e;color:#fff;border-color:#0f3d2e}
@media (prefers-color-scheme:dark){.chips button.on{background:var(--gold);color:#111;border-color:var(--gold)}}
input[type=search]{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;margin-bottom:10px}
.info{font-size:13px;color:var(--mute);margin:0 0 10px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px}
.btn.full{width:100%;margin-bottom:12px}
.row2{display:flex;gap:10px;margin-bottom:14px}
.row2 .btn{flex:1}
.tas{text-align:center}
.dhikr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 6px}
.dhikr button{min-height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--line);background:var(--chip);font-family:"Amiri","Noto Naskh Arabic",serif;font-size:17px}
.dhikr button.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.tas .big{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:34px;line-height:1.8;color:var(--accent);margin:4px 0 0}
.tas .num{font-size:76px;line-height:1.15;font-weight:700;color:var(--accent)}
.bar{height:6px;border-radius:3px;background:var(--line);margin:6px auto 4px;max-width:260px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .15s}
.tapbtn{width:188px;height:188px;border-radius:50%;border:6px solid var(--gold);background:#0f3d2e;color:#fff;font-size:21px;font-weight:600;box-shadow:0 10px 24px rgba(15,61,46,.28);margin-top:12px}
.tapbtn:active{transform:scale(.96)}
.about{text-align:center}
.about .tile{width:100px;height:100px;margin:6px auto 0;border-radius:26px;background:#0f3d2e;display:flex;align-items:center;justify-content:center}
.about .tile svg{width:88px;height:88px}
.about h2{margin:8px 0 2px}
.about p{margin:8px 0;text-align:left}
.about .small{font-size:12.5px;color:var(--mute)}
</style>
</head>

function pack(book, l){
  const k = book + '.' + l;
  if (!packs[k]) packs[k] = fetch(`data/${k}.json`).then(r => { if (!r.ok) throw new Error(k); return r.json(); }).catch(e => { delete packs[k]; throw e; });
  return packs[k];
}

function el(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) { if (k==='class') e.className=v; else if (k.startsWith('on')) e[k]=v; else e.setAttribute(k,v); }
  for (const c of kids) e.append(c);
  return e;
}
const icon = (name, label, onclick) => { const b = el('button',{class:'ic','aria-label':label}); b.innerHTML = ICON[name]; b.onclick = onclick; return b; };

function pick(item){
  const t = item.t;
  if (t[lang]) return {text:t[lang], fb:false};
  return {text:t.en || '', fb:true};
}

async function copyText(txt, btn){
  try { await navigator.clipboard.writeText(txt); if (btn) { btn.setAttribute('aria-label', L().copied); btn.style.color = 'var(--goldtxt)'; setTimeout(() => { btn.style.color = ''; btn.setAttribute('aria-label', L().copy); }, 1200); } } catch (e) {}
}

function card(item, book){
  const {text, fb} = pick(item);
  const title = titleOf(book)[lang] || titleOf(book).en;
  const srcText = item.src || `${title} #${item.n}`;
  const full = [item.t.ar || '', text, srcText].filter(Boolean).join('\n\n');
  const c = el('div',{class:'card'});
  if (item.h) c.append(el('div',{class:'topic'}, item.h[lang] || item.h.en));
  const longAr = (item.t.ar || '').length > LONG_AR, longTr = text.length > LONG_TR;
  if (item.t.ar) c.append(el('p',{class:'ar' + (longAr ? ' long' : ''), lang:'ar'}, item.t.ar));
  const p = el('p',{class:'tr' + (longTr ? ' long' : '')}, text);
  if (lang === 'ur') { p.dir = 'rtl'; p.style.textAlign = 'right'; }
  c.append(p);
  if (longAr || longTr) {
    const m = el('button',{class:'more'}, L().read);
    m.onclick = () => { const open = c.classList.toggle('open'); m.textContent = open ? L().less : L().read; };
    c.append(m);
  }
  const acts = el('div',{class:'acts'});
  const cp = icon('copy', L().copy, () => copyText(full, cp));
  acts.append(cp, icon('share', L().share, async () => {
    if (navigator.share) { try { await navigator.share({text: full}); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    copyText(full);
  }));
  c.append(el('div',{class:'foot'}, el('span',{class:'src'}, `${L().ref}: ${srcText}`), acts));
  if (fb && L().fb) c.append(el('div',{class:'note'}, L().fb));
  return c;
}

// Today: short hadith only, so the home screen never turns into a wall of text.
function shortPool(){
  const all = [], mine = [];   // mine = has a real translation in the chosen language
  for (const b of Object.keys(DATA)) for (const it of DATA[b].items) {
    const tr = pick(it).text;
    if ((it.t.ar || '').length <= 340 && tr.length > 0 && tr.length <= 460) { all.push([b, it]); if (it.t[lang]) mine.push([b, it]); }
  }
  return mine.length >= 5 ? mine : all;
}
function viewToday(){
  const pool = shortPool();
  const d = new Date(); const day = Math.floor((d - new Date(d.getFullYear(),0,0))/864e5);
  const [b, it] = pool[(day + todayShift) % pool.length];
  let dateStr = '';
  try { dateStr = d.toLocaleDateString(LANGS[lang][2], {weekday:'long', day:'numeric', month:'long', year:'numeric'}); } catch (e) { dateStr = d.toDateString(); }
  const next = el('button',{class:'btn full'}, L().next);
  next.onclick = () => { todayShift++; render(true); };
  return [el('h2',{class:'page'}, L().today), el('p',{class:'sub'}, dateStr), card(it, b), next];
}

function viewLib(){
  const token = ++libToken;
  const row = el('div',{class:'chips'});
  for (const b of allCols()){
    const btn = el('button',{class:b===coll?'on':''}, titleOf(b)[lang] || titleOf(b).en);
    btn.onclick = () => { coll=b; limit=PAGE; render(); };
    row.append(btn);
  }
  const s = el('input',{type:'search',placeholder:L().search,value:q,'aria-label':L().lib});
  const list = el('div');
  const info = el('p',{class:'info'});
  const more = el('button',{class:'btn full',style:'display:none'}, L().more);
  more.onclick = () => { limit += PAGE; draw(); };
  s.oninput = () => { q = s.value; limit = PAGE; draw(); };

  async function draw(){
    const needle = q.trim().toLowerCase();
    let cards, total;
    if (BIG[coll]) {
      list.replaceChildren(el('div',{class:'card'}, L().loading));
      let ar, tr, en; const bl = bigLang();
      try { [ar, tr, en] = await Promise.all([pack(coll,'ar'), pack(coll,bl), pack(coll,'en')]); }
      catch(e){ if (token===libToken){ list.replaceChildren(el('div',{class:'card'}, L().err)); more.style.display='none'; } return; }
      if (token !== libToken) return;
      const keys = Object.keys(ar).sort((a,b) => parseFloat(a)-parseFloat(b));
      let hits = keys;
      if (needle) {
        const nAr = normAr(needle);
        if (!normCache[coll]) normCache[coll] = {};
        hits = keys.filter(k => k === needle || (normCache[coll][k] ??= normAr(ar[k])).includes(nAr) || (tr[k]||'').toLowerCase().includes(needle));
      }
      total = hits.length;
      cards = hits.slice(0, limit).map(k => { const t = {ar:ar[k]}; if (en[k]) t.en = en[k]; if (tr[k]) t[bl] = tr[k]; return card({n:k, t, src:`${titleOf(coll).en} #${k}`}, coll); });
    } else {
      const r = DATA[coll].items.filter(it => !needle || String(it.n)===needle || (it.h && Object.values(it.h).some(x => x.toLowerCase().includes(needle))) || Object.values(it.t).some(t => t.toLowerCase().includes(needle)));
      total = r.length;
      cards = r.slice(0, limit).map(it => card(it, coll));
    }
    list.replaceChildren(...(cards.length ? cards : [el('div',{class:'card'}, L().none)]));
    info.textContent = total ? `${Math.min(limit,total)} / ${total}` : '';
    more.style.display = total > limit ? 'block' : 'none';
  }
  draw();
  requestAnimationFrame(() => { const on = row.querySelector('.on'); if (on) row.scrollLeft = on.offsetLeft - 14; });
  return [row, s, info, list, more];
}

let dIdx = +(store.get('dIdx') || 0);
function viewTas(){
  const key = 'cnt'+dIdx;
  const [ar,target] = ADHKAR[dIdx];
  const n = +(store.get(key) || 0);
  const wrap = el('div',{class:'card tas'});
  const chips = el('div',{class:'dhikr'});
  ADHKAR.forEach((a,i)=>{ const b=el('button',{class:i===dIdx?'on':'',lang:'ar'},a[0]); b.onclick=()=>{dIdx=i;store.set('dIdx',i);render(true);}; chips.append(b); });
  const num = el('div',{class:'num'}, String(n));
  const fill = el('i'); const bar = el('div',{class:'bar'}, fill);
  const setBar = v => { fill.style.width = (v % target === 0 && v > 0 ? 100 : (v % target) / target * 100) + '%'; };
  setBar(n);
  const tap = el('button',{class:'tapbtn'}, L().tap);
  tap.onclick = () => { const v=(+(store.get(key)||0))+1; store.set(key,v); num.textContent=v; setBar(v); if (navigator.vibrate) navigator.vibrate(v%target===0 ? 150 : 15); };
  const rs = el('button',{class:'btn',style:'margin-top:16px;min-width:150px'}, L().reset);
  rs.onclick = () => { store.set(key,0); num.textContent='0'; setBar(0); };
  wrap.append(chips, el('p',{class:'big',lang:'ar'}, ar), el('div',{class:'sub',style:'margin:0'}, `${L().count} / ${target}`), num, bar, tap, el('div'), rs);
  return [wrap];
}

function viewAbout(){
  const c = el('div',{class:'card about'});
  const tile = el('div',{class:'tile'}); tile.innerHTML = LOGO;
  c.append(tile, el('h2',{}, L().aboutH), el('div',{class:'small'}, L().ver), el('p',{}, L().aboutT), el('p',{class:'small'}, L().aboutD));
  return [c];
}

function render(keepScroll){
  document.documentElement.lang = lang;
  document.documentElement.dir = LANGS[lang][1];
  $('#brand').innerHTML = LOGO;
  $('#brand').append(el('h1',{}, L().app));
  $('#nav').replaceChildren(...[['today','home'],['lib','lib'],['tas','tas'],['about','about']].map(([t,ic]) => {
    const b = el('button',{class:t===tab?'on':'','aria-label':L()[t === 'today' ? 'home' : t]});
    b.innerHTML = ICON[ic]; b.append(el('span',{}, L()[t === 'today' ? 'home' : t]));
    b.onclick = () => { if (DATA.nawawi) { tab = t; render(); } };
    return b;
  }));
  const v = {today:viewToday, lib:viewLib, tas:viewTas, about:viewAbout}[tab]();
  $('#view').replaceChildren(...v);
  if (!keepScroll) window.scrollTo(0, 0);
}

const sel = $('#lang');
for (const [c,[name]] of Object.entries(LANGS)) sel.append(el('option',{value:c}, name));
sel.value = lang;
sel.onchange = () => { lang = sel.value; store.set('lang',lang); if (DATA.nawawi) render(true); };

$('#brand').innerHTML = LOGO; $('#brand').append(el('h1',{}, L().app));
$('#view').replaceChildren(el('div',{class:'card'}, L().loading));
fetch('data/hadith.json').then(r => r.json()).then(d => { DATA = d; render(); })
  .catch(() => $('#view').replaceChildren(el('div',{class:'card'}, L().err)));
</script>
